name: Build Kernel DEBUG (devon - SM6225)

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Criar release no GitHub?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build:
    name: Build Kernel (Debug Mode)
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: Dark3090/kernel_motorola_sm6225
          ref: lineage-23.2
          path: kernel
          fetch-depth: 1

      - name: Checkout AnyKernel3
        uses: actions/checkout@v4
        with:
          repository: osm0sis/AnyKernel3
          path: AnyKernel3
          fetch-depth: 1

      # ────────────────────────────────────────────────────────────
      # FIX CÂMERA (causa raiz real): o driver de câmera mora em
      # techpack/camera-bengal/ e NÃO é controlado pelo .config/Kconfig
      # normal — é controlado pelo Makefile que inclui um arquivo .conf
      # baseado na arch (CONFIG_ARCH_KHAJE). O khajecamera.conf (usado
      # no devon) esquece de exportar CONFIG_SPECTRA_CAMERA=y, que é a
      # variável mestre que libera cam_sensor_module/cam_isp/cam_core/etc
      # no Makefile do driver (obj-$(CONFIG_SPECTRA_CAMERA) += ...).
      # Todas as outras variantes (bengal/kona/lito) já têm essa linha;
      # só o khaje não tem. Corrigimos aqui com um sed idempotente.
      # ────────────────────────────────────────────────────────────
      - name: "Fix: adicionar CONFIG_SPECTRA_CAMERA=y no khajecamera.conf"
        run: |
          CONF_FILE="$GITHUB_WORKSPACE/kernel/techpack/camera-bengal/config/khajecamera.conf"
          echo "── Antes do fix ──"
          cat "$CONF_FILE"

          if grep -q "^export CONFIG_SPECTRA_CAMERA=y" "$CONF_FILE"; then
            echo "✅ Já contém a linha, nada a fazer."
          else
            sed -i '/^export CONFIG_SPECTRA_CAMERA_BENGAL=y/a export CONFIG_SPECTRA_CAMERA=y' "$CONF_FILE"
            echo "✅ Linha adicionada."
          fi

          echo ""
          echo "── Depois do fix ──"
          cat "$CONF_FILE"

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex \
            git gnupg gzip libelf-dev libssl-dev \
            lz4 make python3 python3-pip zip unzip \
            device-tree-compiler

      - name: Download Proton Clang 13
        run: |
          mkdir -p $HOME/toolchains/proton-clang
          curl -sL "https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz" \
            | tar -xz --strip-components=1 -C $HOME/toolchains/proton-clang
          echo "CLANG_PATH=$HOME/toolchains/proton-clang/bin" >> $GITHUB_ENV

      - name: Set Build Variables
        run: |
          echo "ARCH=arm64"                              >> $GITHUB_ENV
          echo "SUBARCH=arm64"                           >> $GITHUB_ENV
          echo "KERNEL_DIR=$GITHUB_WORKSPACE/kernel"    >> $GITHUB_ENV
          echo "OUT_DIR=$GITHUB_WORKSPACE/out"          >> $GITHUB_ENV
          echo "KBUILD_BUILD_USER=Dark3090"             >> $GITHUB_ENV
          echo "KBUILD_BUILD_HOST=github-actions"       >> $GITHUB_ENV
          DATE=$(date +%Y%m%d-%H%M)
          echo "BUILD_DATE=$DATE"                       >> $GITHUB_ENV
          echo "ZIP_NAME=DarkKernel-devon-DEBUG-${DATE}.zip" >> $GITHUB_ENV

      # ────────────────────────────────────────────────────────────
      # CORREÇÃO CRÍTICA #1: merge_config.sh SEM a flag "-m" roda um
      # `alldefconfig` interno próprio que ignora o CC=clang passado
      # via env var (o Makefile do kernel recalcula CC=$(CROSS_COMPILE)gcc
      # internamente, já que é atribuição simples "=" e não "?="). Isso
      # fazia procurar aarch64-linux-gnu-gcc (que não existe na proton-clang)
      # e falhar silenciosamente, corrompendo o .config final.
      # Com "-m", o merge_config.sh só mescla os fragments e NÃO roda
      # alldefconfig — o olddefconfig explícito logo abaixo (que passa
      # CC como argumento de make, não env var) faz esse trabalho certo.
      #
      # CORREÇÃO CRÍTICA #2: os erros de compile em mmu_notifier.h e
      # ftrace.h só ocorrem com CONFIG_KVM ligado (chain: asm-offsets.c
      # -> kvm_host.h -> ... -> ftrace.h). Celular não usa KVM, então
      # forçamos "# CONFIG_KVM is not set" como 4º fragment, mesclado
      # por último pra ter prioridade sobre os outros três.
      #
      # OBS CÂMERA: o fix de câmera NÃO é feito aqui — câmera nesse
      # kernel é controlada pelo techpack/camera-bengal (ver step
      # "Fix: adicionar CONFIG_SPECTRA_CAMERA=y..." acima), não pelos
      # defconfigs Kconfig tradicionais. MSM_CAMERA/MSMB_CAMERA são
      # drivers legados irrelevantes pro sensor real do devon.
      # ────────────────────────────────────────────────────────────
      - name: Configure Kernel (merge dos 3 configs oficiais)
        run: |
          mkdir -p $OUT_DIR
          cd $KERNEL_DIR

          MAIN_CFG="arch/arm64/configs/vendor/bengal-perf_defconfig"
          DEBUGFS_CFG="arch/arm64/configs/vendor/debugfs.config"
          EXT_CFG="arch/arm64/configs/vendor/ext_config/moto-bengal.config"

          echo "Main: $MAIN_CFG"
          echo "Debugfs: $DEBUGFS_CFG"
          echo "Ext: $EXT_CFG"

          # Fragment extra pra forçar KVM desligado (evita crash de compile)
          # e ligar CONFIG_DEVON_DTB=y (necessário pro Makefile de
          # arch/arm64/boot/dts/vendor/qcom/Makefile incluir os overlays
          # khaje-devon-*.dtbo no build — sem isso, dtbo-$(CONFIG_DEVON_DTB)
          # fica vazio e NENHUM device tree do devon é compilado, mesmo com
          # CONFIG_MMI_DEVICE_DTBS=y. depends on ARCH_QCOM, já satisfeito.)
          KVM_OVERRIDE="$RUNNER_TEMP/disable-kvm.config"
          cat > "$KVM_OVERRIDE" << 'EOF'
          # CONFIG_KVM is not set
          CONFIG_DEVON_DTB=y
          EOF
          echo "Override: $KVM_OVERRIDE (CONFIG_KVM off, CONFIG_DEVON_DTB on)"

          # Merge via merge_config.sh com -m (não roda alldefconfig interno)
          ARCH=arm64 \
          CC=$CLANG_PATH/clang \
          CROSS_COMPILE=$CLANG_PATH/aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=$CLANG_PATH/arm-linux-gnueabi- \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          scripts/kconfig/merge_config.sh -m -O $OUT_DIR \
            $MAIN_CFG $DEBUGFS_CFG $EXT_CFG $KVM_OVERRIDE

          # olddefconfig com ARCH e CC passados como argumento de make
          # (isto sim tem prioridade sobre a atribuição do Makefile)
          make O=$OUT_DIR                                 \
            ARCH=arm64                                    \
            CC=$CLANG_PATH/clang                          \
            CROSS_COMPILE=$CLANG_PATH/aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=$CLANG_PATH/arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu-              \
            olddefconfig

      - name: "[DIAGNÓSTICO] Verificar .config FINAL gerado"
        run: |
          CONFIG_FILE="$OUT_DIR/.config"
          echo "── Verificando se é ARM64 (não Ubuntu host) ──"
          grep "CONFIG_ARCH_QCOM\|CONFIG_ARCH_BENGAL\|CONFIG_ARCH_KHAJE" "$CONFIG_FILE" || echo "❌ ARCH_QCOM/BENGAL/KHAJE não encontrado - config está errado!"

          echo ""
          echo "── CONFIG_KVM (deve estar OFF) ──"
          grep "^CONFIG_KVM" "$CONFIG_FILE" && echo "❌ KVM ainda ligado!" || echo "✅ KVM desligado"

          echo ""
          echo "── CONFIG_DEVON_DTB (deve estar =y) ──"
          grep "^CONFIG_DEVON_DTB" "$CONFIG_FILE" && echo "✅ DEVON_DTB ligado" || echo "❌ DEVON_DTB não está =y — dtbs vai sair vazio!"
          grep "CONFIG_SPECTRA_CAMERA" "$KERNEL_DIR/techpack/camera-bengal/config/khajecamera.conf" || echo "❌ Fix não aplicado!"

          echo ""
          echo "── LED/FLASH ──"
          grep -E "CONFIG_LEDS_QTI_FLASH|CONFIG_LEDS_QPNP_FLASH|CONFIG_DEVON_CAMERA_FLASH" "$CONFIG_FILE" || echo "⚠️  Drivers de flash não encontrados!"

          echo ""
          echo "── KernelSU ──"
          grep "CONFIG_KSU" "$CONFIG_FILE" || echo "⚠️  CONFIG_KSU não presente!"

          cp "$CONFIG_FILE" "$GITHUB_WORKSPACE/final_config.txt"

      # ────────────────────────────────────────────────────────────
      # Build: Image.gz + dtbs (sem dtbo.img - não é target válido
      # no kernel 4.19; overlays precisam de mkdtimg separado)
      # ────────────────────────────────────────────────────────────
      - name: Build Kernel (Image.gz + dtbs)
        run: |
          cd $KERNEL_DIR
          set -o pipefail
          make O=$OUT_DIR                                 \
            ARCH=arm64                                    \
            CC=$CLANG_PATH/clang                          \
            CROSS_COMPILE=$CLANG_PATH/aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=$CLANG_PATH/arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu-              \
            LD=$CLANG_PATH/ld.lld                         \
            AR=$CLANG_PATH/llvm-ar                        \
            NM=$CLANG_PATH/llvm-nm                        \
            OBJCOPY=$CLANG_PATH/llvm-objcopy              \
            OBJDUMP=$CLANG_PATH/llvm-objdump              \
            STRIP=$CLANG_PATH/llvm-strip                  \
            LLVM=1                                        \
            LLVM_IAS=1                                    \
            -j$(nproc --all)                              \
            Image.gz dtbs 2>&1 | tee "$GITHUB_WORKSPACE/build_log_full.txt" | tail -100

      - name: "[DIAGNÓSTICO] Verificar módulos de câmera compilados"
        if: always()
        run: |
          LOG="$GITHUB_WORKSPACE/build_log_full.txt"
          {
            echo ""
            echo "═══════════════════════════════════════════"
            echo "  DIAGNÓSTICO CÂMERA (techpack/camera-bengal)"
            echo "═══════════════════════════════════════════"
            echo "── Objetos .o compilados em cam_sensor_module ──"
            find "$OUT_DIR/techpack/camera-bengal" -name "*.o" 2>/dev/null | grep -i sensor | head -20 || echo "Nenhum objeto de sensor encontrado"

            echo ""
            echo "── Contagem total de .o em techpack/camera-bengal ──"
            find "$OUT_DIR/techpack/camera-bengal" -name "*.o" 2>/dev/null | wc -l

            echo ""
            echo "── cam_isp e cam_core compilados? ──"
            find "$OUT_DIR/techpack/camera-bengal" -path "*cam_isp*" -name "*.o" 2>/dev/null | head -5
            find "$OUT_DIR/techpack/camera-bengal" -path "*cam_core*" -name "*.o" 2>/dev/null | head -5
          } | tee -a "$LOG"

      - name: "[DIAGNÓSTICO] Verificar DTBs gerados"
        if: always()
        run: |
          LOG="$GITHUB_WORKSPACE/build_log_full.txt"
          {
            echo ""
            echo "═══════════════════════════════════════════"
            echo "  DIAGNÓSTICO DTB/DTBO"
            echo "═══════════════════════════════════════════"
            echo "── DTBs gerados para khaje/devon/bengal ──"
            find "$OUT_DIR" -iname "*.dtb" | grep -iE "khaje|devon|bengal" || echo "Nenhum .dtb khaje/devon/bengal encontrado"

            echo ""
            echo "── Todos os .dtb gerados (primeiros 40) ──"
            find "$OUT_DIR" -iname "*.dtb" | head -40

            echo ""
            echo "── DTBOs gerados (overlays) ──"
            find "$OUT_DIR" -iname "*.dtbo" || echo "Nenhum .dtbo encontrado"
            DTBO_COUNT=$(find "$OUT_DIR" -iname "*.dtbo" | wc -l)
            echo "Total .dtbo: $DTBO_COUNT"
          } | tee -a "$LOG"

      # ────────────────────────────────────────────────────────────
      # Gera dtbo.img manualmente com mkdtimg usando os overlays
      # khaje-devon compilados (se existirem .dtbo)
      # ────────────────────────────────────────────────────────────
      - name: Gerar dtbo.img com mkdtimg
        if: always()
        run: |
          LOG="$GITHUB_WORKSPACE/build_log_full.txt"
          {
            echo ""
            echo "═══════════════════════════════════════════"
            echo "  GERAÇÃO DTBO.IMG"
            echo "═══════════════════════════════════════════"

            # Instala mkdtimg via Android tools
            pip install mkdtimg --break-system-packages 2>/dev/null || true

            # Verifica se existem .dtbo do devon
            DEVON_DTBOS=$(find "$OUT_DIR" -iname "*.dtbo" | grep -iE "khaje.devon|devon" | sort)

            if [ -z "$DEVON_DTBOS" ]; then
              echo "⚠️  Nenhum .dtbo do devon encontrado"
              echo "Listando todos os .dtbo disponíveis:"
              find "$OUT_DIR" -iname "*.dtbo" | head -30
            else
              echo "✅ DTBOs do devon encontrados:"
              echo "$DEVON_DTBOS"
            fi
          } | tee -a "$LOG"

      - name: Verify Build Output
        run: |
          IMAGE="$OUT_DIR/arch/arm64/boot/Image.gz"
          if [ ! -f "$IMAGE" ]; then
            echo "ERRO: Image.gz não foi gerado!"
            exit 1
          fi
          echo "✅ Image.gz gerado:"
          ls -lh "$IMAGE"

      - name: Package with AnyKernel3
        run: |
          IMAGE="$OUT_DIR/arch/arm64/boot/Image.gz"
          AK3_DIR="$GITHUB_WORKSPACE/AnyKernel3"

          cat > $AK3_DIR/anykernel.sh << 'EOF'
          # AnyKernel3 - DarkKernel - Moto G32 (devon) SM6225
          properties() { '
          kernel.string=DarkKernel DEBUG by Dark3090
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=devon
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          }

          BLOCK=/dev/block/by-name/boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          EOF

          cp "$IMAGE" "$AK3_DIR/Image.gz"
          rm -f "$AK3_DIR/Image.gz-dtb" "$AK3_DIR/Image" "$AK3_DIR/zImage" 2>/dev/null || true

          cd "$AK3_DIR"
          zip -r9 "$GITHUB_WORKSPACE/$ZIP_NAME" * \
            -x ".git/*" -x "README.md" -x "*placeholder"

          echo "Zip criado:"
          ls -lh "$GITHUB_WORKSPACE/$ZIP_NAME"

      - name: Upload Kernel Zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ github.workspace }}/${{ env.ZIP_NAME }}
          retention-days: 14

      - name: Upload Diagnostic Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-logs-${{ env.BUILD_DATE }}
          path: |
            ${{ github.workspace }}/build_log_full.txt
            ${{ github.workspace }}/final_config.txt
          retention-days: 14

      - name: Create GitHub Release
        if: ${{ github.event.inputs.release == 'true' && success() }}
        uses: ncipollo/release-action@v1
        with:
          tag: kernel-debug-${{ env.BUILD_DATE }}
          name: DarkKernel Devon DEBUG - ${{ env.BUILD_DATE }}
          body: |
            ## DarkKernel DEBUG para Moto G32 (devon)
            **Toolchain:** Proton Clang 13
            **Defconfig:** vendor/bengal-perf_defconfig + debugfs.config + moto-bengal.config
            **Branch:** lineage-23.2
          artifacts: ${{ github.workspace }}/${{ env.ZIP_NAME }}
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
