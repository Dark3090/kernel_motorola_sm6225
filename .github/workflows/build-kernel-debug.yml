name: Build Kernel DEBUG (devon - SM6225)

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Criar release no GitHub?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build:
    name: Build Kernel (Debug Mode)
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      # ────────────────────────────────────────────────────────────
      # 1. Checkout do kernel source
      # ────────────────────────────────────────────────────────────
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: Dark3090/kernel_motorola_sm6225
          ref: lineage-23.2
          path: kernel
          fetch-depth: 1

      - name: Checkout AnyKernel3
        uses: actions/checkout@v4
        with:
          repository: osm0sis/AnyKernel3
          path: AnyKernel3
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex \
            git gnupg gzip libelf-dev libssl-dev \
            lz4 make python3 python3-pip zip unzip \
            device-tree-compiler

      - name: Download Proton Clang 13
        run: |
          mkdir -p $HOME/toolchains/proton-clang
          curl -sL "https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz" \
            | tar -xz --strip-components=1 -C $HOME/toolchains/proton-clang
          echo "CLANG_PATH=$HOME/toolchains/proton-clang/bin" >> $GITHUB_ENV

      - name: Set Build Variables
        run: |
          echo "ARCH=arm64"                              >> $GITHUB_ENV
          echo "SUBARCH=arm64"                           >> $GITHUB_ENV
          echo "DEFCONFIG=vendor/bengal-perf_defconfig" >> $GITHUB_ENV
          echo "KERNEL_DIR=$GITHUB_WORKSPACE/kernel"    >> $GITHUB_ENV
          echo "OUT_DIR=$GITHUB_WORKSPACE/out"          >> $GITHUB_ENV
          echo "KBUILD_BUILD_USER=Dark3090"             >> $GITHUB_ENV
          echo "KBUILD_BUILD_HOST=github-actions"       >> $GITHUB_ENV
          DATE=$(date +%Y%m%d-%H%M)
          echo "BUILD_DATE=$DATE"                       >> $GITHUB_ENV
          echo "ZIP_NAME=DarkKernel-devon-DEBUG-${DATE}.zip" >> $GITHUB_ENV

      # ────────────────────────────────────────────────────────────
      # 2. DIAGNÓSTICO: Verifica drivers vendor-specific da Motorola
      #    presentes no defconfig ANTES de compilar
      # ────────────────────────────────────────────────────────────
      - name: "[DIAGNÓSTICO] Verificar configs críticos no defconfig"
        run: |
          echo "════════════════════════════════════════════════"
          echo "  VERIFICANDO CONFIGS CRÍTICOS DO DEFCONFIG"
          echo "════════════════════════════════════════════════"
          DEFCONFIG_PATH="$KERNEL_DIR/arch/arm64/configs/$DEFCONFIG"

          if [ ! -f "$DEFCONFIG_PATH" ]; then
            echo "❌ ERRO: defconfig não encontrado em $DEFCONFIG_PATH"
            find $KERNEL_DIR/arch/arm64/configs -iname "*bengal*"
            exit 1
          fi

          echo "✅ Defconfig encontrado: $DEFCONFIG_PATH"
          echo ""
          echo "── Configs de CÂMERA (CAM) ──"
          grep -E "CONFIG_.*CAM" "$DEFCONFIG_PATH" || echo "⚠️  Nenhum config de câmera encontrado!"
          echo ""
          echo "── Configs de FLASH/LANTERNA (LED/FLASH) ──"
          grep -E "CONFIG_.*(LED|FLASH|TORCH)" "$DEFCONFIG_PATH" || echo "⚠️  Nenhum config de flash/LED encontrado!"
          echo ""
          echo "── Configs QCOM/MSM específicos ──"
          grep -E "CONFIG_QCOM|CONFIG_MSM" "$DEFCONFIG_PATH" | wc -l
          echo ""
          echo "── Configs KernelSU ──"
          grep -E "CONFIG_KSU" "$DEFCONFIG_PATH" || echo "⚠️  KernelSU não habilitado explicitamente no defconfig (pode estar habilitado via Kconfig default)"

      # ────────────────────────────────────────────────────────────
      # 3. DIAGNÓSTICO: Lista drivers vendor que existem no source
      #    mas podem não estar sendo compilados
      # ────────────────────────────────────────────────────────────
      - name: "[DIAGNÓSTICO] Verificar drivers vendor-specific presentes no source"
        run: |
          echo "════════════════════════════════════════════════"
          echo "  DRIVERS VENDOR-SPECIFIC NO SOURCE TREE"
          echo "════════════════════════════════════════════════"
          cd $KERNEL_DIR

          echo "── Drivers de câmera (drivers/media/platform/msm/camera*) ──"
          find drivers -path "*camera*" -type d 2>/dev/null | head -20

          echo ""
          echo "── Drivers de LED/flash (drivers/leds) ──"
          find drivers/leds -type f -name "*.c" 2>/dev/null | head -20

          echo ""
          echo "── Verificar se há Kconfig de câmera referenciado no Makefile pai ──"
          grep -r "camera" drivers/media/platform/msm/Makefile 2>/dev/null || echo "Makefile de camera não encontrado no path esperado"

          echo ""
          echo "── drivers/kernelsu presente? ──"
          ls -la drivers/kernelsu/ 2>/dev/null || echo "⚠️  drivers/kernelsu NÃO existe no source!"

      # ────────────────────────────────────────────────────────────
      # 4. Configurar defconfig (olddefconfig evita prompts)
      # ────────────────────────────────────────────────────────────
      - name: Configure Kernel
        run: |
          mkdir -p $OUT_DIR
          cd $KERNEL_DIR
          make O=$OUT_DIR                                 \
            ARCH=$ARCH                                    \
            CC=$CLANG_PATH/clang                          \
            CROSS_COMPILE=$CLANG_PATH/aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=$CLANG_PATH/arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu-              \
            $DEFCONFIG
          make O=$OUT_DIR                                 \
            ARCH=$ARCH                                    \
            CC=$CLANG_PATH/clang                          \
            CROSS_COMPILE=$CLANG_PATH/aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=$CLANG_PATH/arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu-              \
            olddefconfig

      # ────────────────────────────────────────────────────────────
      # 5. DIAGNÓSTICO: Verifica o .config FINAL gerado (pós-merge)
      #    Isso é o que realmente vai ser compilado
      # ────────────────────────────────────────────────────────────
      - name: "[DIAGNÓSTICO] Verificar .config FINAL (pós olddefconfig)"
        run: |
          echo "════════════════════════════════════════════════"
          echo "  .CONFIG FINAL - O QUE REALMENTE SERÁ COMPILADO"
          echo "════════════════════════════════════════════════"
          CONFIG_FILE="$OUT_DIR/.config"

          echo "── CÂMERA no .config final ──"
          grep -E "CONFIG_.*CAM" "$CONFIG_FILE" | grep "=y" || echo "⚠️  NENHUM driver de câmera habilitado (=y) no .config final!"
          echo ""
          echo "── LED/FLASH no .config final ──"
          grep -E "CONFIG_.*(LED|FLASH|TORCH)" "$CONFIG_FILE" | grep "=y" || echo "⚠️  NENHUM driver de LED/flash habilitado (=y) no .config final!"
          echo ""
          echo "── KernelSU no .config final ──"
          grep -E "CONFIG_KSU" "$CONFIG_FILE" || echo "⚠️  CONFIG_KSU não presente no .config final!"
          echo ""
          echo "── Configs que foram REMOVIDOS pelo olddefconfig (comparar com defconfig original) ──"
          diff <(grep "=y\|=m" "$KERNEL_DIR/arch/arm64/configs/$DEFCONFIG" | sort) \
               <(grep "=y\|=m" "$CONFIG_FILE" | sort) | grep "^<" | head -40 || echo "Nenhuma diferença crítica encontrada"

          # Salva o .config completo como artifact pra análise posterior
          cp "$CONFIG_FILE" "$GITHUB_WORKSPACE/final_config.txt"

      # ────────────────────────────────────────────────────────────
      # 6. Compilar com VERBOSE=1 para capturar todos os warnings
      # ────────────────────────────────────────────────────────────
      - name: Build Kernel (Image.gz, verbose)
        run: |
          cd $KERNEL_DIR
          set -o pipefail
          make O=$OUT_DIR                                 \
            ARCH=$ARCH                                    \
            CC=$CLANG_PATH/clang                          \
            CROSS_COMPILE=$CLANG_PATH/aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=$CLANG_PATH/arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu-              \
            LD=$CLANG_PATH/ld.lld                         \
            AR=$CLANG_PATH/llvm-ar                        \
            NM=$CLANG_PATH/llvm-nm                        \
            OBJCOPY=$CLANG_PATH/llvm-objcopy              \
            OBJDUMP=$CLANG_PATH/llvm-objdump              \
            STRIP=$CLANG_PATH/llvm-strip                  \
            LLVM=1                                        \
            LLVM_IAS=1                                    \
            V=1                                            \
            -j$(nproc --all)                              \
            Image.gz 2>&1 | tee "$GITHUB_WORKSPACE/build_log_full.txt" | tail -200

      # ────────────────────────────────────────────────────────────
      # 7. DIAGNÓSTICO: Extrai apenas warnings/errors do log completo
      # ────────────────────────────────────────────────────────────
      - name: "[DIAGNÓSTICO] Extrair warnings e errors do build"
        if: always()
        run: |
          echo "════════════════════════════════════════════════"
          echo "  WARNINGS E ERRORS DO BUILD"
          echo "════════════════════════════════════════════════"
          if [ -f "$GITHUB_WORKSPACE/build_log_full.txt" ]; then
            echo "── Linhas com 'error' ──"
            grep -i "error" "$GITHUB_WORKSPACE/build_log_full.txt" | head -50 || echo "Nenhum erro literal encontrado"
            echo ""
            echo "── Linhas com 'warning' relacionadas a camera/led/flash/qcom ──"
            grep -iE "warning.*(camera|led|flash|torch|qcom|msm)" "$GITHUB_WORKSPACE/build_log_full.txt" | head -50 || echo "Nenhum warning relevante encontrado"
            echo ""
            echo "── Módulos que falharam silenciosamente (CONFIG=y mas sem .o gerado) ──"
            grep -i "undefined reference\|implicit declaration" "$GITHUB_WORKSPACE/build_log_full.txt" | head -30 || echo "Nenhuma referência indefinida encontrada"
          fi

      - name: Verify Build Output
        run: |
          IMAGE="$OUT_DIR/arch/arm64/boot/Image.gz"
          if [ ! -f "$IMAGE" ]; then
            echo "ERRO: Image.gz não foi gerado!"
            exit 1
          fi
          echo "Image.gz gerado com sucesso:"
          ls -lh "$IMAGE"

      # ────────────────────────────────────────────────────────────
      # 8. DIAGNÓSTICO: Verifica módulos carregáveis (.ko) que talvez
      #    precisem ir junto no vendor_boot/vendor_dlkm
      # ────────────────────────────────────────────────────────────
      - name: "[DIAGNÓSTICO] Verificar módulos .ko gerados"
        run: |
          echo "════════════════════════════════════════════════"
          echo "  MÓDULOS .KO GERADOS (podem ser necessários no vendor_boot)"
          echo "════════════════════════════════════════════════"
          find "$OUT_DIR" -name "*.ko" 2>/dev/null | head -50
          KO_COUNT=$(find "$OUT_DIR" -name "*.ko" 2>/dev/null | wc -l)
          echo ""
          echo "Total de módulos .ko gerados: $KO_COUNT"
          if [ "$KO_COUNT" -eq 0 ]; then
            echo "⚠️  ATENÇÃO: Nenhum módulo .ko foi gerado!"
            echo "   Se o kernel original (stock/lineage) usa módulos carregáveis"
            echo "   para câmera/sensores, a ausência deles pode causar falha de boot"
            echo "   ou os recursos não funcionarem mesmo sem causar bootloop."
          fi

      # ────────────────────────────────────────────────────────────
      # 9. Empacotar com AnyKernel3 (config corrigida: BLOCK maiúsculo,
      #    dump_boot/write_boot em vez de flash_boot)
      # ────────────────────────────────────────────────────────────
      - name: Package with AnyKernel3
        run: |
          IMAGE="$OUT_DIR/arch/arm64/boot/Image.gz"
          AK3_DIR="$GITHUB_WORKSPACE/AnyKernel3"

          cat > $AK3_DIR/anykernel.sh << 'EOF'
          # AnyKernel3 - DarkKernel DEBUG - Moto G32 (devon) SM6225
          properties() { '
          kernel.string=DarkKernel DEBUG by Dark3090
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=devon
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          }

          BLOCK=/dev/block/by-name/boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          EOF

          cp "$IMAGE" "$AK3_DIR/Image.gz"
          rm -f "$AK3_DIR/Image.gz-dtb" "$AK3_DIR/Image" "$AK3_DIR/zImage" 2>/dev/null || true

          cd "$AK3_DIR"
          zip -r9 "$GITHUB_WORKSPACE/$ZIP_NAME" * \
            -x ".git/*" -x "README.md" -x "*placeholder"

          echo "Zip criado: $GITHUB_WORKSPACE/$ZIP_NAME"
          ls -lh "$GITHUB_WORKSPACE/$ZIP_NAME"

      # ────────────────────────────────────────────────────────────
      # 10. Upload de TODOS os artifacts de diagnóstico + o kernel
      # ────────────────────────────────────────────────────────────
      - name: Upload Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ github.workspace }}/${{ env.ZIP_NAME }}
          retention-days: 14

      - name: Upload Diagnostic Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-logs-${{ env.BUILD_DATE }}
          path: |
            ${{ github.workspace }}/build_log_full.txt
            ${{ github.workspace }}/final_config.txt
          retention-days: 14

      - name: Create GitHub Release
        if: ${{ github.event.inputs.release == 'true' }}
        uses: ncipollo/release-action@v1
        with:
          tag: kernel-debug-${{ env.BUILD_DATE }}
          name: DarkKernel Devon DEBUG - ${{ env.BUILD_DATE }}
          body: |
            ## DarkKernel DEBUG para Moto G32/G42/G52 (devon)

            Build de diagnóstico com logs completos anexados.
            Verifique os artifacts `diagnostic-logs-*` para análise de:
            - Configs de câmera/flash presentes no defconfig vs .config final
            - Warnings e errors do build completo
            - Módulos .ko gerados

            **Toolchain:** Proton Clang 13
            **Defconfig:** vendor/bengal-perf_defconfig
            **Branch:** lineage-23.2
          artifacts: ${{ github.workspace }}/${{ env.ZIP_NAME }}
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
